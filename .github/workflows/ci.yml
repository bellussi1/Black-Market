name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:ssr
      - run: pnpm test:legal:layout
      - run: pnpm --filter @bdo/web i18n:extract
      - run: git diff --exit-code -- apps/web/src/locale/messages.pt-BR.xlf
      - run: pnpm db:check
      - name: Validate staging Compose
        run: docker compose --env-file .env.example -f docker-compose.staging.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-validation-only
          POSTGRES_APP_PASSWORD: ci-validation-only-runtime-password
          CONTAINER_DATABASE_URL: postgresql://ci:ci@postgres:5432/ci
          RUNTIME_DATABASE_URL: postgresql://ci:ci@postgres:5432/ci
          PUBLIC_SITE_URL: https://staging.example
          ASSET_CHECKSUMS: ci-validation-only
      - name: Validate staging PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/staging.ps1', 'scripts/staging-backup.ps1', 'scripts/staging-guards.ps1', 'scripts/test-staging-guards.ps1')) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          & (Join-Path $PWD 'scripts/test-staging-guards.ps1')
