<div class="preset-bar">
  <label class="field"
    ><ng-container i18n>Nome do preset</ng-container
    ><input
      hlmInput
      maxlength="140"
      placeholder="Meu cenário"
      i18n-placeholder
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
  /></label>
  <button
    hlmBtn
    variant="outline"
    class="btn"
    type="button"
    [disabled]="!name().trim()"
    (click)="save()"
  >
    <ng-container i18n>Salvar preset </ng-container>
  </button>
  <label class="field"
    ><ng-container i18n>Presets desta região</ng-container
    ><select appBdoSelect [ngModel]="selected()" (ngModelChange)="selected.set($event)">
      <option value=""><ng-container i18n>Escolher preset</ng-container></option>
      @for (p of presets(); track p.id) {
        <option [value]="p.id">{{ p.name }}</option>
      }
    </select></label
  >
  <button
    hlmBtn
    variant="outline"
    class="btn subtle"
    type="button"
    [disabled]="!selected()"
    (click)="load()"
  >
    <ng-container i18n>Carregar </ng-container>
  </button>
  <button
    hlmBtn
    variant="outline"
    class="btn subtle"
    type="button"
    [disabled]="!selected()"
    (click)="remove()"
  >
    <ng-container i18n>Excluir preset </ng-container>
  </button>
</div>
