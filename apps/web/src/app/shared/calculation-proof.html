<div class="proof">
  <button
    class="btn subtle"
    type="button"
    (click)="verify()"
    [disabled]="status() === 'loading'"
    i18n
  >
    Conferir resultado
  </button>
  @if (status() === 'loading') {
    <app-loading-skeleton variant="inline" label="Conferindo o cálculo" />
  } @else {
    <div role="status" aria-live="polite">
      {{ message() }}
    </div>
  }
</div>
