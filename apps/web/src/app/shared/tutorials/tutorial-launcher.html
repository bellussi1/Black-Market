@if (guide()) {
  <button
    #launcher
    type="button"
    [attr.aria-busy]="starting() ? 'true' : null"
    [class.is-starting]="starting()"
    (click)="start(launcher)"
  >
    <span class="tutorial-spinner" [class.is-active]="starting()" aria-hidden="true"></span>
    @if (starting()) {
      <span i18n>Iniciando tutorial…</span>
    } @else {
      <span i18n>Tutorial desta tela</span>
    }
  </button>
} @else if (loading()) {
  <span class="tutorial-loading" role="status" aria-live="polite" aria-busy="true">
    <span class="tutorial-sr-only" i18n>Carregando tutorial…</span>
    <span class="tutorial-loading-skeleton" aria-hidden="true"></span>
  </span>
} @else if (error()) {
  <span i18n>Tutorial indisponível.</span>
  <button type="button" (click)="load()" i18n>Tentar novamente</button>
}
@if (message()) {
  <p class="tutorial-message" role="status" aria-live="polite">{{ message() }}</p>
}
