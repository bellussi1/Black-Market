<article
  class="ingredient"
  [class.expanded]="node().expanded"
  [class.root-step]="node().path === 'root'"
  [attr.aria-busy]="node().loading"
>
  <button
    type="button"
    class="step-toggle"
    [disabled]="node().loading"
    [attr.aria-expanded]="node().recipe ? node().expanded : null"
    [attr.aria-controls]="node().recipe && node().expanded ? 'branch-' + node().path : null"
    [attr.aria-describedby]="
      'step-count-' + node().path + (allocation() ? ' step-stock-' + node().path : '')
    "
    [attr.aria-label]="
      (node().recipe
        ? node().expanded
          ? 'Recolher ingredientes de '
          : 'Ver ingredientes de '
        : 'Ver como obter ') + node().part.name
    "
    (click)="emit(node().recipe && node().expanded ? 'collapse' : 'expand')"
  >
    <span class="step-chevron" [class.open]="node().recipe && node().expanded" aria-hidden="true"
      >›</span
    >
    <app-item-icon [url]="catalog.resolveIconUrl(node().part)" [name]="node().part.name" />
    <span class="step-identity">
      <span class="step-title-row">
        <strong>{{ node().part.name }}</strong>
        <span class="step-action-badge" [attr.data-kind]="stepActionKind()">
          {{ stepActionLabel() }}
        </span>
      </span>
      <span class="step-hint">
        @if (node().loading) {
          <span class="step-hint-loading">
            <span class="step-hint-loading-line" aria-hidden="true"></span>
            <span class="sr-only" role="status" i18n>Buscando receita…</span>
          </span>
        } @else if (node().recipe) {
          {{
            node().expanded
              ? 'Ocultar ingredientes'
              : 'Ver ' + node().children.length + ' ingredientes'
          }}
        } @else {
          <ng-container i18n>Ver como obter</ng-container>
        }
      </span>
    </span>
    @if (allocation(); as row) {
      <span class="step-quantity" [id]="'step-count-' + node().path"
        ><small>Necessário</small><strong>{{ row.required }}</strong>
        @if (row.fromStock + row.fromSurplus > 0) {
          <small class="step-stock-used">Estoque: {{ row.fromStock + row.fromSurplus }}</small>
        }
      </span>
      <span
        class="step-stock"
        [id]="'step-stock-' + node().path"
        [class.available]="row.missing === 0"
        >{{ row.missing === 0 ? 'No estoque' : 'Faltam ' + row.missing }}</span
      >
    } @else {
      <span class="step-quantity" [id]="'step-count-' + node().path"
        ><small>Por operação</small
        ><strong>{{
          node().part.quantity === null ? 'A confirmar' : +node().part.quantity!
        }}</strong></span
      >
    }
  </button>
  <div class="step-tools">
    <button type="button" class="step-source" (click)="emit('source')">
      Detalhes e ajustes do item
    </button>
  </div>
  @if (node().message) {
    <p class="step-message" role="status">{{ node().message }}</p>
  }
  @if (node().recipe && node().expanded) {
    <div
      class="branch-children"
      [id]="'branch-' + node().path"
      animate.enter="steps-enter"
      animate.leave="steps-leave"
    >
      <p class="children-heading">Ingredientes de {{ node().part.name }}</p>
      @for (child of node().children; track child.path) {
        <app-recipe-branch
          [node]="child"
          [allocations]="allocations()"
          (action)="action.emit($event)"
        />
      }
    </div>
  }
</article>
