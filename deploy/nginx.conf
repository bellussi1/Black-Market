events {}
http {
  log_format safe escape=json '{"time":"$time_iso8601","level":"INFO","component":"gateway","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  error_log /dev/stderr crit;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=market:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=account:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=240r/m;
  limit_req_status 429;
  server {
    listen 80;
    client_max_body_size 256k;
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"statusCode":429,"message":"Aguarde um pouco antes de tentar novamente."}';
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location ~ ^/(health|ready)$ {
      proxy_pass http://api:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 5s;
      add_header Cache-Control "no-store" always;
    }
    location /api/v1/workspace {
      client_max_body_size 20m;
      limit_req zone=account burst=10 nodelay;
      proxy_pass http://api:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header Cache-Control "private, no-store" always;
      proxy_read_timeout 15s;
    }
    location /api/v1/market/ {
      limit_req zone=market burst=5 nodelay;
      proxy_pass http://api:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 15s;
    }
    location /api/ {
      limit_req zone=public_api burst=60 nodelay;
      proxy_pass http://api:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 15s;
    }
    location ~ ^/api/v1/items/[1-9][0-9]*/icon$ {
      proxy_pass http://api:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 15s;
    }
    location / {
      proxy_pass http://web:4000;
      proxy_set_header Host $host;
      # Production entry is HTTPS via the local Cloudflare Tunnel.
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }
  }
}
