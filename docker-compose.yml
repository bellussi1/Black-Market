services:
  postgres:
    image: postgres:17-alpine
    container_name: bdo-companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdo_companion}
      POSTGRES_USER: ${POSTGRES_USER:-bdo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdo_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bdo} -d ${POSTGRES_DB:-bdo_companion}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://bdo:bdo_local_only@postgres:5432/bdo_companion}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4200}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://bdo:bdo_local_only@postgres:5432/bdo_companion}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
