name: black-market
x-local-build: &local-build
  context: .
  args:
    WEB_BUILD_CONFIGURATION: development
services:
  postgres:
    image: postgres:17-alpine
    container_name: black-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdo_companion}
      POSTGRES_USER: ${POSTGRES_USER:-bdo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdo_local_only}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bdo} -d ${POSTGRES_DB:-bdo_companion}']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: black-market-migrate:local
    build: *local-build
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://bdo:bdo_local_only@postgres:5432/bdo_companion}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: black-market-api:local
    build: *local-build
    environment:
      NODE_ENV: development
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      POSTHOG_PUBLIC_KEY: ${POSTHOG_PUBLIC_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      PORT: 3000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4200}
      MARKET_PROVIDER_ENABLED: ${MARKET_PROVIDER_ENABLED:-true}
      MARKET_COLLECTOR_ENABLED: ${MARKET_COLLECTOR_ENABLED:-false}
      MARKET_BOARD_COLLECTOR_ENABLED: ${MARKET_BOARD_COLLECTOR_ENABLED:-true}
      MARKET_TRACKED_ITEMS: ${MARKET_TRACKED_ITEMS:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLIC_KEY: ${SUPABASE_PUBLIC_KEY:-}
      CATALOG_ASSETS_DIR: /workspace/data/assets
      CATALOG_ASSETS_PUBLIC_URL: ${CATALOG_ASSETS_PUBLIC_URL:-}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://bdo:bdo_local_only@postgres:5432/bdo_companion}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data/assets:/workspace/data/assets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

  web:
    profiles: ['web']
    image: black-market-api:local
    build: *local-build
    command: ['pnpm', '--filter', '@bdo/web', 'start']
    environment:
      API_BASE_URL: http://api:3000
      NODE_ENV: development
      NG_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - '127.0.0.1:4200:4200'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./packages/calculators/src:/workspace/packages/calculators/src
      - ./packages/calculators/dist:/workspace/packages/calculators/dist
      - ./packages/shared/src:/workspace/packages/shared/src
      - ./packages/shared/dist:/workspace/packages/shared/dist
      - ./packages/domain/dist:/workspace/packages/domain/dist

  import:
    profiles: ['data']
    image: black-market-api:local
    build: *local-build
    command: ['node', 'apps/api/dist/catalog/import-game-data.js']
    environment:
      NODE_ENV: development
      MARKET_COLLECTOR_ENABLED: 'false'
      MARKET_PROVIDER_ENABLED: 'false'
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://bdo:bdo_local_only@postgres:5432/bdo_companion}
    volumes:
      - ./data/extracted:/workspace/data/extracted:ro
      - ./data/assets:/workspace/data/assets
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-black-market-postgres-data}
    external: ${POSTGRES_DATA_EXTERNAL:-false}
